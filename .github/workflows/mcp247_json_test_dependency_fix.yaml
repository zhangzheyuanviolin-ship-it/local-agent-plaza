name: Repair MCP247 JVM org.json test runtime

on:
  push:
    branches: ["experimental"]
    paths:
      - '.github/workflows/mcp247_json_test_dependency_fix.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental
          fetch-depth: 0
      - name: Inject real org.json only into local JVM unit tests
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/run_mcp247_emergency_build.sh')
          s=p.read_text()
          old="      p.dependencies.add('testImplementation', 'com.google.truth:truth:1.4.4')\n"
          new=(
            "      p.dependencies.add('testImplementation', 'com.google.truth:truth:1.4.4')\n"
            "      p.dependencies.add('testImplementation', 'org.json:json:20260719')\n"
          )
          if s.count(old) != 1:
              raise SystemExit(f'MCP247 Truth dependency anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git diff --quiet -- Android model_allowlists
          grep -F "org.json:json:20260719" .github/scripts/run_mcp247_emergency_build.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/scripts/run_mcp247_emergency_build.sh
          git commit -m 'MCP247: inject org.json only for JVM unit tests'
          git push origin HEAD:experimental
