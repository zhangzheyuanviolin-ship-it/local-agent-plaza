name: Validate MCP197 Kotlin

on:
  push:
    branches: [mcp197-work]
    paths:
      - '.github/workflows/validate-mcp197-kotlin.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp197-work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile release Kotlin
        working-directory: Android/src
        run: ./gradlew compileReleaseKotlin
