name: MCP238 Final Build

on:
  push:
    branches: ["experimental"]
    paths:
      - '.github/workflows/mcp238_final.yaml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: mcp238-final
  cancel-in-progress: false

jobs:
  publish_model:
    name: Publish verified Qwen3.5 multipart model
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_ARTIFACT_ID: '9367298862'
      RELEASE_TAG: 'qwen35-2b-q8-4096-v1'
      MODEL_NAME: 'Qwen3.5-2B-LiteRT-LM-Q8-4096.litertlm'
      MODEL_SIZE: '4780966112'
      MODEL_SHA256: 'a3a7cd9d05242200a4f819228e7cd3987e046f5fd81b030d71eb88e4a96fcd03'
      CHUNK_SIZE: '1200000000'
    steps:
      - name: Publish final-run marker
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          python - <<'PY' > "$RUNNER_TEMP/run.json"
          import json, os
          print(json.dumps({
              'schema': 'local-agent-plaza.mcp238-final-run.v1',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_number': int(os.environ['GITHUB_RUN_NUMBER']),
              'head_sha': os.environ['GITHUB_SHA'],
              'html_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, indent=2))
          PY
          CONTENT="$(base64 -w0 "$RUNNER_TEMP/run.json")"
          API="repos/$GITHUB_REPOSITORY/contents/docs/mcp238_final_run.json"
          SHA="$(gh api "$API?ref=experimental" --jq .sha 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message="Update MCP238 final run marker" -f branch=experimental -f sha="$SHA" -f content="$CONTENT"
          else
            gh api --method PUT "$API" -f message="Add MCP238 final run marker" -f branch=experimental -f content="$CONTENT"
          fi

      - name: Check whether verified release already exists
        id: release_check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/release-check"
          mkdir -p "$RUNNER_TEMP/release-check"
          READY=false
          if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir "$RUNNER_TEMP/release-check" >/dev/null 2>&1; then
            if python - <<'PY'
          import json, os, pathlib, sys
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-check' / 'manifest.json'
          d = json.loads(p.read_text())
          names = [f"{os.environ['MODEL_NAME']}.part{i:02d}" for i in range(4)]
          sizes = [1200000000,1200000000,1200000000,1180966112]
          ok = (
              d.get('fileName') == os.environ['MODEL_NAME']
              and int(d.get('sizeInBytes', -1)) == int(os.environ['MODEL_SIZE'])
              and d.get('sha256') == os.environ['MODEL_SHA256']
              and [p.get('name') for p in d.get('parts', [])] == names
              and [int(p.get('size', -1)) for p in d.get('parts', [])] == sizes
          )
          sys.exit(0 if ok else 1)
          PY
            then READY=true; fi
          fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "release ready=$READY"

      - name: Reclaim runner disk space
        if: steps.release_check.outputs.ready != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          docker system prune -af || true
          df -h

      - name: Download source artifact and locate model by exact size and hash
        if: steps.release_check.outputs.ready != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          curl --fail-with-body -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          rm -f "$RUNNER_TEMP/source.zip"
          echo "Extracted artifact files:"
          find "$RUNNER_TEMP/source" -maxdepth 3 -type f -printf '%s %p\n' | sort -n
          mapfile -t CANDIDATES < <(find "$RUNNER_TEMP/source" -type f -size "${MODEL_SIZE}c" -print)
          test "${#CANDIDATES[@]}" -ge 1
          MODEL_PATH=""
          for CANDIDATE in "${CANDIDATES[@]}"; do
            ACTUAL_SHA="$(sha256sum "$CANDIDATE" | awk '{print $1}')"
            echo "candidate=$CANDIDATE sha256=$ACTUAL_SHA"
            if [ "$ACTUAL_SHA" = "$MODEL_SHA256" ]; then
              MODEL_PATH="$CANDIDATE"
              break
            fi
          done
          test -n "$MODEL_PATH"
          echo "MODEL_PATH=$MODEL_PATH" >> "$GITHUB_ENV"
          echo "Located verified model at $MODEL_PATH"

      - name: Stream-split and publish model release assets
        if: steps.release_check.outputs.ready != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Qwen3.5-2B LiteRT-LM Q8 4096 v1" \
              --notes "Verified Local Agent Plaza Qwen3.5-2B Q8/4096 LiteRT-LM test artifact. Full size: $MODEL_SIZE bytes. SHA-256: $MODEL_SHA256. MCP238 downloads and reconstructs the four parts automatically."
          rm -rf "$RUNNER_TEMP/parts"
          mkdir -p "$RUNNER_TEMP/parts"
          python - <<'PY'
          import hashlib, json, os, pathlib
          src = pathlib.Path(os.environ['MODEL_PATH'])
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'parts'
          full_size = int(os.environ['MODEL_SIZE'])
          chunk_size = int(os.environ['CHUNK_SIZE'])
          expected_sha = os.environ['MODEL_SHA256']
          full_hash = hashlib.sha256()
          parts=[]
          total=0
          with src.open('rb') as f:
              idx=0
              while total < full_size:
                  want=min(chunk_size, full_size-total)
                  name=f"{os.environ['MODEL_NAME']}.part{idx:02d}"
                  path=out/name
                  ph=hashlib.sha256(); written=0
                  with path.open('wb') as g:
                      while written < want:
                          b=f.read(min(8*1024*1024, want-written))
                          if not b: raise RuntimeError('Unexpected EOF')
                          g.write(b); full_hash.update(b); ph.update(b)
                          written += len(b); total += len(b)
                  parts.append({'name':name,'size':written,'sha256':ph.hexdigest()})
                  idx += 1
              if f.read(1): raise RuntimeError('Unexpected trailing bytes')
          assert total == full_size
          assert full_hash.hexdigest() == expected_sha
          assert [p['size'] for p in parts] == [1200000000,1200000000,1200000000,1180966112]
          manifest={'schema':'local-agent-plaza.multipart-model.v1','fileName':os.environ['MODEL_NAME'],'sizeInBytes':full_size,'sha256':expected_sha,'parts':parts}
          (out/'manifest.json').write_text(json.dumps(manifest, indent=2)+'\n')
          print(json.dumps(manifest, indent=2))
          PY
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/parts/"* --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets,url

      - name: Verify public release manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/final-release-check"
          mkdir -p "$RUNNER_TEMP/final-release-check"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir "$RUNNER_TEMP/final-release-check"
          cat "$RUNNER_TEMP/final-release-check/manifest.json"

  build_apk:
    name: Build signed MCP238 APK
    needs: publish_model
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      LOCAL_VERSION_NAME: '1.0.14-mcp.238'
      LOCAL_VERSION_CODE: '338'
      APPLICATION_ID_SUFFIX: '.mcp'
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Checkout MCP238 source
        uses: actions/checkout@v4

      - name: Preflight MCP238 Python patch syntax
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/patch_mcp238_qwen35_model_download_v2.py
          python3 -m py_compile scripts/patch_mcp224_inference_diag_context_fix.py

      - name: Checkout stable-diffusion.cpp
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 19bdfe22d255d5b4dff39d449318b9bc5ea2317f
          path: Android/src/app/src/main/cpp/third_party/stable-diffusion.cpp
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare release signing
        shell: bash
        run: |
          set -euxo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/local-agent-plaza-release.jks"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/local-agent-plaza-release.jks" >> "$GITHUB_ENV"

      - name: Build MCP238 release APK
        shell: bash
        run: ./gradlew assembleRelease

      - name: Verify signed APK identity
        shell: bash
        run: |
          set -euxo pipefail
          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep "name='com.localagent.plaza.mcp'"
          echo "$BADGING" | grep "versionCode='338'"
          echo "$BADGING" | grep "versionName='1.0.14-mcp.238'"

      - name: Rename MCP238 APK
        id: rename
        shell: bash
        run: |
          set -euxo pipefail
          SRC="app/build/outputs/apk/release/app-release.apk"
          APK="local-agent-plaza-1.0.14-mcp.238.apk"
          cp "$SRC" "$APK"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA" "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload MCP238 APK artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: local-agent-plaza-mcp-238
          path: |
            Android/src/local-agent-plaza-1.0.14-mcp.238.apk
            Android/src/local-agent-plaza-1.0.14-mcp.238.apk.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Publish MCP238 final result
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          APK_SHA: ${{ steps.rename.outputs.sha }}
        run: |
          set -euxo pipefail
          python - <<'PY' > "$RUNNER_TEMP/result.json"
          import json, os
          print(json.dumps({
              'schema':'local-agent-plaza.mcp238-final-result.v1',
              'run_id':int(os.environ['GITHUB_RUN_ID']),
              'run_number':int(os.environ['GITHUB_RUN_NUMBER']),
              'head_sha':os.environ['GITHUB_SHA'],
              'artifact_id':int(os.environ['ARTIFACT_ID']),
              'artifact_url':os.environ['ARTIFACT_URL'],
              'artifact_name':'local-agent-plaza-mcp-238',
              'apk_name':'local-agent-plaza-1.0.14-mcp.238.apk',
              'apk_sha256':os.environ['APK_SHA'],
              'version_name':'1.0.14-mcp.238',
              'version_code':338,
              'package':'com.localagent.plaza.mcp',
              'model_release_tag':'qwen35-2b-q8-4096-v1',
              'model_size':4780966112,
              'model_sha256':'a3a7cd9d05242200a4f819228e7cd3987e046f5fd81b030d71eb88e4a96fcd03'
          }, indent=2))
          PY
          CONTENT="$(base64 -w0 "$RUNNER_TEMP/result.json")"
          API="repos/$GITHUB_REPOSITORY/contents/docs/mcp238_final_result.json"
          SHA="$(gh api "$API?ref=experimental" --jq .sha 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message="Update MCP238 final build result" -f branch=experimental -f sha="$SHA" -f content="$CONTENT"
          else
            gh api --method PUT "$API" -f message="Add MCP238 final build result" -f branch=experimental -f content="$CONTENT"
          fi
