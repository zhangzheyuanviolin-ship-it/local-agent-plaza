name: Qwen3.5 4B v6 Transition Probe

on:
  push:
    branches: [experimental]
    paths:
      - '.github/workflows/qwen35_4b_v6_transition_probe.yaml'

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental
          fetch-depth: 0
      - name: Extract transition around first conversion failure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/96644673999/logs" -o /tmp/v6.log
          mkdir -p /tmp/z
          if file /tmp/v6.log | grep -qi 'zip archive'; then
            unzip -q /tmp/v6.log -d /tmp/z
            find /tmp/z -type f -print0 | sort -z | xargs -0 cat > /tmp/all.log
          else
            cp /tmp/v6.log /tmp/all.log
          fi
          mkdir -p docs
          sed -n '8440,8810p' /tmp/all.log > /tmp/transition.raw
          grep -vE 'QWEN35_4B_V6_RESOURCE_MONITOR|^.*Z[[:space:]]+(Mem:|Swap:|Filesystem|/swapfile|/mnt/qwen35-4b-32k|tmpfs|overlay|/dev/root|[[:space:]]*PID[[:space:]]|[[:space:]]*[0-9]+[[:space:]]+[0-9]+[[:space:]]+[0-9]+[[:space:]]+[0-9]+[[:space:]][0-9.]+[[:space:]][0-9.]+[[:space:]])' /tmp/transition.raw > docs/qwen35_4b_q8_32768_v6_transition_probe.txt || true
      - name: Persist probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/qwen35_4b_q8_32768_v6_transition_probe.txt
          git commit -m 'diagnostics: capture Qwen3.5 4B v6 transition'
          git pull --rebase origin experimental
          git push origin HEAD:experimental
