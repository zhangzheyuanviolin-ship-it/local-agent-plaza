name: Research Box Z-Image runtime

on:
  push:
    branches: [ "mcp201-zimage-work" ]
    paths:
      - '.github/workflows/research-zimage-box.yml'

permissions:
  contents: read

jobs:
  rope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and decompile Box 3.3.3
        run: |
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/Box.apk" https://github.com/jegly/Box/releases/download/v3.3.3/Box_v3.3.3_Main_Signed_Release.apk
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/jadx.zip" https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          "$RUNNER_TEMP/jadx/bin/jadx" -j 4 --no-res -d "$RUNNER_TEMP/box-src" "$RUNNER_TEMP/Box.apk" || true
      - name: Print exact Z-Image RoPE dimensions and position preparation
        run: |
          SRC="$RUNNER_TEMP/box-src/sources/defpackage"
          echo '===== Z ENGINE LINES 35-115 ====='
          sed -n '35,115p' "$SRC/i0I00l.java"
          echo '===== STATIC ROPE DIM ARRAY CLASS ====='
          sed -n '1,220p' "$SRC/iO1Oo1o0OOio.java" || true
          echo '===== ALL REFERENCES TO STATIC ROPE ARRAY ====='
          grep -RIn 'iO1Oo1o0OOio.I00000oIO' "$SRC" | head -n 100 || true
          echo '===== CAPTION POSITION PREP CANDIDATES ====='
          grep -RInE 'new int\[\]\{.*i4|new int\[\]\{.*0, 0|capPadToken|3840|z_refc' "$SRC/i0I00l.java" "$SRC/OOl11O0ii0II.java" | head -n 250 || true
