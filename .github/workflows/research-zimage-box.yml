name: Research Box Z-Image runtime

on:
  push:
    branches: [ "mcp201-zimage-work" ]
    paths:
      - '.github/workflows/research-zimage-box.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp201-zimage-work
      - name: Extract verified Z-Image host constants from Box 3.3.3
        run: |
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/Box.apk" \
            https://github.com/jegly/Box/releases/download/v3.3.3/Box_v3.3.3_Main_Signed_Release.apk
          mkdir -p Android/src/app/src/main/assets/zimage
          unzip -p "$RUNNER_TEMP/Box.apk" assets/zimage/zimage_cap_pad_token.bin \
            > Android/src/app/src/main/assets/zimage/zimage_cap_pad_token.bin
          unzip -p "$RUNNER_TEMP/Box.apk" assets/zimage/zimage_temb_mlp.bin \
            > Android/src/app/src/main/assets/zimage/zimage_temb_mlp.bin
          test "$(stat -c%s Android/src/app/src/main/assets/zimage/zimage_cap_pad_token.bin)" = "15360"
          test "$(stat -c%s Android/src/app/src/main/assets/zimage/zimage_temb_mlp.bin)" = "2102272"
          sha256sum Android/src/app/src/main/assets/zimage/*.bin
      - name: Commit constants
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Android/src/app/src/main/assets/zimage/zimage_cap_pad_token.bin
          git add Android/src/app/src/main/assets/zimage/zimage_temb_mlp.bin
          git commit -m "MCP201: add Box-verified Z-Image host constants"
          git push origin HEAD:mcp201-zimage-work
