name: Qwen3.5 Feature Conversion Runner

on:
  push:
    branches:
      - 'feature/qwen35-*'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: qwen35-feature-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CONFIG_PATH: model-conversion/qwen35/configs/2b-q8-4096.json
      OUTPUT_DIR: ${{ github.workspace }}/qwen35-output
      HF_HOME: ${{ runner.temp }}/hf-home
      TRANSFORMERS_CACHE: ${{ runner.temp }}/hf-home
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "qwen35-litert-conversion",
              "description": "Qwen3.5-2B Q8 conversion running",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary "@$RUNNER_TEMP/status.json"

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Qwen3.5 conversion and validation
        shell: bash
        run: bash model-conversion/qwen35/run_github_ci.sh

      - name: Upload verified model artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-2b-q8-4096-litertlm
          path: |
            qwen35-output/*.litertlm
            qwen35-output/*.sha256
            qwen35-output/conversion_manifest.json
            qwen35-output/runtime_smoke_output.txt
            qwen35-output/verification.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euxo pipefail
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
              "state": "success",
              "context": "qwen35-litert-conversion",
              "description": "Verified Qwen3.5-2B Q8 / 4096 artifact published",
              "target_url": os.environ['ARTIFACT_URL'],
          }))
          PY
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary "@$RUNNER_TEMP/status.json"

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
              "state": "failure",
              "context": "qwen35-litert-conversion",
              "description": "Qwen3.5 conversion failed; inspect workflow logs",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary "@$RUNNER_TEMP/status.json"
