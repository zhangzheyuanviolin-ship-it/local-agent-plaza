name: MCP242 Qwen3.5 compatible repetition runtime

on:
  push:
    branches: ["experimental"]
    paths:
      - '.github/workflows/mcp242_qwen35_compatible_repetition.yaml'
      - 'Android/src/scripts/patch_mcp242_qwen35_compatible_repetition.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: mcp242-qwen35-compatible-repetition
  cancel-in-progress: false

jobs:
  build:
    name: Build patched runtime and signed MCP242 APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MCP240_MODEL_SIZE: '4780966112'
      MCP240_MODEL_SHA256: '119bdfb5464b9c3746b26d43211474fcfcbbe8a8c36693e3c0413b8d5b9d7d0f'
      MODEL_RELEASE_TAG: 'qwen35-2b-q8-4096-mcp240-natural-v2'
      MODEL_FILE: 'Qwen3.5-2B-LiteRT-LM-Q8-4096-mcp240.litertlm'
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      LOCAL_VERSION_NAME: '1.0.14-mcp.242'
      LOCAL_VERSION_CODE: '342'
      APPLICATION_ID_SUFFIX: '.mcp'
      APK_RELEASE_TAG: 'mcp242-qwen35-compatible-repetition'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify repaired MCP240 model release
        shell: bash
        run: |
          set -euxo pipefail
          gh release view "$MODEL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/model_release.json"
          python - <<'PY'
          import json, os
          d=json.load(open(os.environ['RUNNER_TEMP']+'/model_release.json'))
          names={a['name'] for a in d['assets']}
          f=os.environ['MODEL_FILE']
          for i in range(10):
              assert f'{f}.part{i:02d}' in names
          assert 'manifest.json' in names
          print('Existing MCP240 repaired model release verified; MCP242 reuses it without redownload.')
          PY

      - name: Checkout LiteRT-LM v0.15.0 source
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT-LM
          ref: v0.15.0
          path: LiteRT-LM
          lfs: true
          submodules: recursive
          fetch-depth: 1

      - name: Prepare Android NDK and Bazelisk
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$NDK" ] || [ "$(basename "$NDK" | cut -d. -f1)" -lt 28 ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
            NDK="$ANDROID_HOME/ndk/28.2.13676358"
          fi
          test -f "$NDK/source.properties"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "Selected NDK: $NDK"
          if ! command -v bazelisk >/dev/null 2>&1; then
            curl -L --fail --retry 3 https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazelisk"
            chmod +x "$RUNNER_TEMP/bazelisk"
            echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          fi

      - name: Backport padded-vocabulary repetition compatibility
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile Android/src/scripts/patch_mcp242_qwen35_compatible_repetition.py
          python3 Android/src/scripts/patch_mcp242_qwen35_compatible_repetition.py --runtime-source LiteRT-LM
          grep -n 'MCP242 backport' LiteRT-LM/runtime/components/logits_processor/repetition_penalty_processor.cc
          git -C LiteRT-LM diff --check

      - name: Build patched arm64 LiteRT-LM JNI
        working-directory: ./LiteRT-LM
        shell: bash
        run: |
          set -euxo pipefail
          test "$(tr -d '\n\r' < .bazelversion)" = '7.6.1'
          bazelisk version
          bazelisk build --config=android_arm64 //kotlin/java/com/google/ai/edge/litertlm/jni:litertlm_jni
          JNI="$(find -L bazel-bin/kotlin/java/com/google/ai/edge/litertlm/jni -type f -name 'liblitertlm_jni.so' | head -n 1)"
          test -n "$JNI"
          file "$JNI"
          readelf -h "$JNI" | grep -E 'Class:|Machine:'
          mkdir -p "$RUNNER_TEMP/mcp242-runtime"
          cp -L "$JNI" "$RUNNER_TEMP/mcp242-runtime/liblitertlm_jni.so"

      - name: Build patched LiteRT-LM 0.15 AAR
        id: runtime
        shell: bash
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/mcp242-runtime"
          curl -L --fail --retry 3 https://dl.google.com/dl/android/maven2/com/google/ai/edge/litertlm/litertlm-android/0.15.0/litertlm-android-0.15.0.aar -o "$WORK/original.aar"
          mkdir -p "$WORK/aar"
          unzip -q "$WORK/original.aar" -d "$WORK/aar"
          JNI_PATH="$(find "$WORK/aar" -type f -path '*/arm64-v8a/liblitertlm_jni.so' | head -n 1)"
          test -n "$JNI_PATH"
          cp "$WORK/liblitertlm_jni.so" "$JNI_PATH"
          printf '%s\n' \
            'MCP242: LiteRT-LM v0.15.0 with padded-vocabulary RepetitionPenaltyProcessor backport.' \
            'Only arm64-v8a liblitertlm_jni.so is replaced; Kotlin API and remaining AAR contents are 0.15.0.' \
            > "$WORK/aar/MCP242_RUNTIME_PATCH.txt"
          (cd "$WORK/aar" && zip -q -r "$WORK/litertlm-android-0.15.0-mcp242.aar" .)
          test -s "$WORK/litertlm-android-0.15.0-mcp242.aar"
          ENTRY="$(realpath --relative-to="$WORK/aar" "$JNI_PATH")"
          unzip -p "$WORK/litertlm-android-0.15.0-mcp242.aar" "$ENTRY" > "$WORK/jni_from_aar.so"
          cmp "$WORK/liblitertlm_jni.so" "$WORK/jni_from_aar.so"
          AAR_SHA="$(sha256sum "$WORK/litertlm-android-0.15.0-mcp242.aar" | awk '{print $1}')"
          JNI_SHA="$(sha256sum "$WORK/liblitertlm_jni.so" | awk '{print $1}')"
          echo "aar_sha=$AAR_SHA" >> "$GITHUB_OUTPUT"
          echo "jni_sha=$JNI_SHA" >> "$GITHUB_OUTPUT"
          mkdir -p Android/src/app/libs
          cp "$WORK/litertlm-android-0.15.0-mcp242.aar" Android/src/app/libs/

      - name: Apply MCP238 MCP239 MCP240 and MCP242 app patches
        working-directory: ./Android/src
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            scripts/patch_mcp238_qwen35_model_download_v3.py \
            scripts/patch_mcp239_qwen35_cpu_only.py \
            scripts/patch_mcp240_qwen35_natural_generation.py \
            scripts/patch_mcp242_qwen35_compatible_repetition.py
          python3 scripts/patch_mcp238_qwen35_model_download_v3.py
          python3 scripts/patch_mcp239_qwen35_cpu_only.py
          python3 scripts/patch_mcp240_qwen35_natural_generation.py
          python3 scripts/patch_mcp242_qwen35_compatible_repetition.py --app

      - name: Verify MCP242 product invariants
        working-directory: ./Android/src
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          name='Qwen3.5-2B LiteRT-LM Q8 4096 Plaza MCP240'
          helper=Path('app/src/main/java/com/google/ai/edge/gallery/ui/llmchat/LlmChatModelHelper.kt').read_text()
          gradle=Path('app/build.gradle.kts').read_text()
          assert 'RepetitionPenaltyConfig(' in helper
          assert 'presencePenalty = 2.0f' in helper
          assert 'repetitionPenalty = 1.0f' in helper
          assert 'MCP240_QWEN35_RECURRENT_STATE_RESET' in helper
          assert 'NoRepeatNgramConfig' not in helper
          assert 'maxOutputToken =' not in helper
          assert 'litertlm-android-0.15.0-mcp242.aar' in gradle
          assert 'implementation(libs.litertlm)' not in gradle
          for p in (Path('../../model_allowlists/1_0_14.json'), Path('app/src/main/assets/model_allowlists/1_0_14.json')):
              matches=[m for m in json.loads(p.read_text())['models'] if m.get('name')==name]
              assert len(matches)==1
              m=matches[0]
              assert m['modelFile']=='Qwen3.5-2B-LiteRT-LM-Q8-4096-mcp240.litertlm'
              assert m['commitHash']=='qwen35-2b-q8-4096-mcp240-natural-v2'
              assert m['sizeInBytes']==4780966112
              cfg=m['defaultConfig']
              assert cfg['accelerators']=='cpu'
              assert (cfg['topK'],cfg['topP'],cfg['temperature'])==(20,1.0,1.0)
              assert cfg['maxTokens']==4096
          print('MCP242 invariants verified: real soft presence penalty plus repaired ChatML/EOS, with no hard truncation/watchdog.')
          PY

      - name: Checkout stable-diffusion.cpp
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 19bdfe22d255d5b4dff39d449318b9bc5ea2317f
          path: Android/src/app/src/main/cpp/third_party/stable-diffusion.cpp
          submodules: recursive

      - name: Prepare release signing
        shell: bash
        run: |
          set -euxo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/local-agent-plaza-release.jks"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/local-agent-plaza-release.jks" >> "$GITHUB_ENV"

      - name: Build MCP242 release APK
        working-directory: ./Android/src
        shell: bash
        run: ./gradlew assembleRelease

      - name: Verify APK identity and patched JNI provenance
        shell: bash
        run: |
          set -euxo pipefail
          APK="Android/src/app/build/outputs/apk/release/app-release.apk"
          BT_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BT_DIR/apksigner" verify --print-certs "$APK"
          BADGING="$("$BT_DIR/aapt" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep "name='com.localagent.plaza.mcp'"
          echo "$BADGING" | grep "versionCode='342'"
          echo "$BADGING" | grep "versionName='1.0.14-mcp.242'"
          JNI_ENTRY="$(unzip -Z1 "$APK" | grep -E '^lib/arm64-v8a/liblitertlm_jni\.so$' | head -n 1)"
          test -n "$JNI_ENTRY"
          unzip -p "$APK" "$JNI_ENTRY" > "$RUNNER_TEMP/apk_litertlm_jni.so"
          ACTUAL_JNI_SHA="$(sha256sum "$RUNNER_TEMP/apk_litertlm_jni.so" | awk '{print $1}')"
          test "$ACTUAL_JNI_SHA" = "${{ steps.runtime.outputs.jni_sha }}"

      - name: Rename and hash APK
        id: apk
        shell: bash
        run: |
          set -euxo pipefail
          SRC="Android/src/app/build/outputs/apk/release/app-release.apk"
          OUT="Android/src/local-agent-plaza-1.0.14-mcp.242.apk"
          cp "$SRC" "$OUT"
          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA" "$(basename "$OUT")" > "$OUT.sha256"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload MCP242 APK artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: local-agent-plaza-mcp-242
          path: |
            Android/src/local-agent-plaza-1.0.14-mcp.242.apk
            Android/src/local-agent-plaza-1.0.14-mcp.242.apk.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Publish permanent MCP242 APK release
        shell: bash
        run: |
          set -euxo pipefail
          gh release view "$APK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$APK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title 'Local Agent Plaza MCP242 Qwen3.5 compatible repetition' \
              --notes 'Qwen3.5 CPU Agent product build. Reuses the repaired MCP240 model with ChatML and natural stop tokens 248044/248046. Restores the official soft presence penalty through a targeted LiteRT-LM 0.15 arm64 padded-vocabulary compatibility backport. No host truncation, repetition watchdog, or hard no-repeat ngram is used.' \
              --prerelease
          gh release upload "$APK_RELEASE_TAG" \
            Android/src/local-agent-plaza-1.0.14-mcp.242.apk \
            Android/src/local-agent-plaza-1.0.14-mcp.242.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish MCP242 result metadata
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          APK_SHA: ${{ steps.apk.outputs.sha }}
          AAR_SHA: ${{ steps.runtime.outputs.aar_sha }}
          JNI_SHA: ${{ steps.runtime.outputs.jni_sha }}
        run: |
          set -euxo pipefail
          python - <<'PY' > "$RUNNER_TEMP/mcp242_result.json"
          import json, os
          print(json.dumps({
              'schema':'local-agent-plaza.mcp242-compatible-repetition.v2',
              'run_id':int(os.environ['GITHUB_RUN_ID']),
              'head_sha':os.environ['GITHUB_SHA'],
              'artifact_id':int(os.environ['ARTIFACT_ID']),
              'artifact_url':os.environ['ARTIFACT_URL'],
              'release_tag':os.environ['APK_RELEASE_TAG'],
              'release_apk_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['APK_RELEASE_TAG']}/local-agent-plaza-1.0.14-mcp.242.apk",
              'apk_name':'local-agent-plaza-1.0.14-mcp.242.apk',
              'apk_sha256':os.environ['APK_SHA'],
              'version_name':'1.0.14-mcp.242',
              'version_code':342,
              'package':'com.localagent.plaza.mcp',
              'model_release_tag':os.environ['MODEL_RELEASE_TAG'],
              'model_file':os.environ['MODEL_FILE'],
              'model_sha256':os.environ['MCP240_MODEL_SHA256'],
              'model_redownload_required':False,
              'backend':'CPU_FORCED',
              'sampler':{'top_k':20,'top_p':1.0,'temperature':1.0},
              'repetition_penalty':{'enabled':True,'repetition_penalty':1.0,'presence_penalty':2.0,'frequency_penalty':0.0,'implementation':'patched LiteRT-LM 0.15 arm64 RepetitionPenaltyProcessor'},
              'patched_aar_sha256':os.environ['AAR_SHA'],
              'patched_jni_sha256':os.environ['JNI_SHA'],
              'model_natural_stop_token_ids':[248044,248046],
              'hard_output_truncation':False,
              'repetition_watchdog_cancel':False,
              'hard_no_repeat_ngram':False,
              'model_decode_logits_shape':[1,1,248320],
              'runtime_fix':'allow padded model vocabulary: use model logits width as batch stride and penalize tokenizer token IDs only'
          },indent=2))
          PY
          CONTENT="$(base64 -w0 "$RUNNER_TEMP/mcp242_result.json")"
          API="repos/$GITHUB_REPOSITORY/contents/docs/mcp242_apk_result.json"
          RESPONSE="$(gh api "$API?ref=experimental" 2>/dev/null || true)"
          EXISTING_SHA="$(printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("sha", ""))' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API" -f message='Update MCP242 APK result' -f branch=experimental -f sha="$EXISTING_SHA" -f content="$CONTENT"
          else
            gh api --method PUT "$API" -f message='Add MCP242 APK result' -f branch=experimental -f content="$CONTENT"
          fi
