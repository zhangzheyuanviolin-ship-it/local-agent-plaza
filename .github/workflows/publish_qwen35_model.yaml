name: Publish Qwen3.5 Q8 Model Assets

on:
  push:
    branches: ["experimental"]
    paths:
      - '.github/workflows/publish_qwen35_model.yaml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-qwen35-q8-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_ARTIFACT_ID: '9367298862'
      RELEASE_TAG: 'qwen35-2b-q8-4096-v1'
      MODEL_NAME: 'Qwen3.5-2B-LiteRT-LM-Q8-4096.litertlm'
      MODEL_SIZE: '4780966112'
      MODEL_SHA256: 'a3a7cd9d05242200a4f819228e7cd3987e046f5fd81b030d71eb88e4a96fcd03'
      CHUNK_SIZE: '1200000000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reclaim runner space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Download verified conversion artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          curl --fail-with-body -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          rm -f "$RUNNER_TEMP/source.zip"
          MODEL_PATH="$(find "$RUNNER_TEMP/source" -type f -name "$MODEL_NAME" -print -quit)"
          test -n "$MODEL_PATH"
          test "$(stat -c %s "$MODEL_PATH")" = "$MODEL_SIZE"
          echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum -c -
          echo "MODEL_PATH=$MODEL_PATH" >> "$GITHUB_ENV"
          df -h

      - name: Split and publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Qwen3.5-2B LiteRT-LM Q8 4096 v1" \
              --notes "Verified LiteRT-LM 0.15.0 test artifact for Local Agent Plaza. Full size: $MODEL_SIZE bytes. SHA-256: $MODEL_SHA256. The Android app reconstructs these multipart assets into $MODEL_NAME."
          rm -rf "$RUNNER_TEMP/parts"
          mkdir -p "$RUNNER_TEMP/parts"
          python - <<'PY'
          import hashlib, json, os, pathlib
          src = pathlib.Path(os.environ['MODEL_PATH'])
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'parts'
          chunk_size = int(os.environ['CHUNK_SIZE'])
          expected_size = int(os.environ['MODEL_SIZE'])
          expected_sha = os.environ['MODEL_SHA256']
          full = hashlib.sha256()
          parts = []
          total = 0
          with src.open('rb') as f:
              idx = 0
              while True:
                  data = f.read(chunk_size)
                  if not data:
                      break
                  full.update(data)
                  total += len(data)
                  name = f"{os.environ['MODEL_NAME']}.part{idx:02d}"
                  p = out / name
                  p.write_bytes(data)
                  parts.append({'name': name, 'size': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
                  idx += 1
          assert total == expected_size, (total, expected_size)
          assert full.hexdigest() == expected_sha, (full.hexdigest(), expected_sha)
          manifest = {
              'schema': 'local-agent-plaza.multipart-model.v1',
              'fileName': os.environ['MODEL_NAME'],
              'sizeInBytes': expected_size,
              'sha256': expected_sha,
              'parts': parts,
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/parts/"* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify published assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets,url
