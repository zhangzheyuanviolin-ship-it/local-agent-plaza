name: MCP252 Office truth verified build

on:
  workflow_dispatch:
  push:
    branches: ["experimental"]
    paths:
      - '.github/workflows/mcp252_office_truth_build.yaml'
      - 'Android/src/app/build.gradle.kts'
      - 'Android/src/scripts/patch_mcp252_office_truth.py'
      - 'Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/agentchat/AgentOfficeTruthGuard.kt'
      - 'Android/src/app/src/test/java/com/google/ai/edge/gallery/customtasks/agentchat/AgentOfficeTruthGuardTest.kt'
      - 'Android/src/app/src/main/assets/skills/word-document/**'
      - 'Android/src/app/src/main/assets/skills/pdf-document/**'
      - 'Android/src/app/src/main/assets/skills/excel-workbook/**'
      - 'Android/src/app/src/main/assets/skills/powerpoint-presentation/**'
      - 'Android/src/app/src/main/assets/skills/document-convert/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: mcp252-office-truth
  cancel-in-progress: true

jobs:
  build:
    name: Evidence audit test build sign and publish MCP252
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LOCAL_VERSION_NAME: '1.0.14-mcp.252'
      LOCAL_VERSION_CODE: '352'
      APPLICATION_ID_SUFFIX: '.mcp'
      APK_RELEASE_TAG: 'mcp252-office-truth-v1'
      APK_NAME: 'local-agent-plaza-1.0.14-mcp.252.apk'
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout experimental source
        uses: actions/checkout@v4
        with:
          ref: experimental
          fetch-depth: 0

      - name: Verify MCP250 golden boundary
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin golden/mcp-250-product-stable:refs/remotes/origin/golden/mcp-250-product-stable
          test "$(git rev-parse refs/remotes/origin/golden/mcp-250-product-stable)" = '4a4346a199344ac0912984f1f383abedf3b93819'
          git diff --name-status refs/remotes/origin/golden/mcp-250-product-stable...HEAD | tee /tmp/mcp252-source-diff.txt
          ! grep -E 'customtasks/(musicgeneration|visualcreation)/|app/src/main/jniLibs/arm64-v8a/' /tmp/mcp252-source-diff.txt

      - name: Reproduce the reported MCP251 failure from the uploaded evidence ZIP
        shell: bash
        run: |
          set -euxo pipefail
          ZIP='logs/mcp-251_测试日志与文档_20260903.zip'
          test -s "$ZIP"
          rm -rf /tmp/mcp251-evidence && mkdir -p /tmp/mcp251-evidence
          unzip -o "$ZIP" -d /tmp/mcp251-evidence >/dev/null
          python3 - <<'PY'
          import json, zipfile, re, html
          from pathlib import Path
          root=Path('/tmp/mcp251-evidence')
          required={
            '20260903-215818-301-word_document.json',
            '20260903-215852-769-word_document.json',
            '20260903-220152-576-word_document.json',
            '20260903-220240-229-word_document.json',
            '20260903-221001-709-word_document.json',
            'self_introduction.docx',
          }
          assert required.issubset({p.name for p in root.iterdir()}), 'reported evidence files missing'
          first=json.loads((root/'20260903-215818-301-word_document.json').read_text())
          assert first['tool_result']['status']=='failed'
          assert 'requires title or content' in first['tool_result']['raw_result_json']
          for name in ('20260903-220152-576-word_document.json','20260903-220240-229-word_document.json'):
            d=json.loads((root/name).read_text())
            assert d['tool_result']['status']=='succeeded'
            assert '"operation":"word_create"' in d['tool_result']['raw_result_json']
          read=json.loads((root/'20260903-221001-709-word_document.json').read_text())
          assert read['tool_result']['status']=='failed'
          assert 'word_create' in read['tool_result']['raw_result_json']
          with zipfile.ZipFile(root/'self_introduction.docx') as z:
            xml=z.read('word/document.xml').decode('utf-8')
          texts=[html.unescape(re.sub('<[^>]+>','',x)) for x in re.findall(r'<w:t(?:\s[^>]*)?>(.*?)</w:t>',xml,re.S)]
          assert texts == ['Self Introduction', ''], texts
          print('MCP251_REPORTED_FALSE_SUCCESS_EVIDENCE_REPRODUCED')
          PY

      - name: Materialize MCP251 then apply MCP252 truth hardening
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile Android/src/scripts/patch_mcp251_office_skills.py
          python3 -m py_compile Android/src/scripts/patch_mcp252_office_truth.py
          cd Android/src
          python3 scripts/patch_mcp251_office_skills.py
          python3 scripts/patch_mcp252_office_truth.py
          AGENT='app/src/main/java/com/google/ai/edge/gallery/customtasks/agentchat'
          grep -F 'MCP252_OFFICE_TRUTH_VERIFIED_DISPATCH' "$AGENT/IntentHandler.kt"
          grep -F 'MCP252_OFFICE_TRUTH_COMPAT_HELPER' "$AGENT/AgentTools.kt"
          grep -F 'MCP252_OFFICE_TRUTH_AUDIT_EVIDENCE' "$AGENT/AgentTools.kt"
          grep -F 'MCP252_OFFICE_TRUTH_SCHEMA_GUIDANCE' "$AGENT/AgentTooling.kt"
          grep -F 'executeVerified' "$AGENT/AgentOfficeTruthGuard.kt"
          ! grep -F 'requested.ifBlank { "create" }' "$AGENT/AgentTools.kt"

      - name: Checkout stable-diffusion.cpp at MCP250 protected revision
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 19bdfe22d255d5b4dff39d449318b9bc5ea2317f
          path: Android/src/app/src/main/cpp/third_party/stable-diffusion.cpp
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare release signing
        shell: bash
        run: |
          set -euxo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/local-agent-plaza-release.jks"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/local-agent-plaza-release.jks" >> "$GITHUB_ENV"

      - name: Run MCP252 targeted regressions and build release APK
        working-directory: Android/src
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew :app:testReleaseUnitTest --tests 'com.google.ai.edge.gallery.customtasks.agentchat.AgentOfficeTruthGuardTest' :app:assembleRelease --stacktrace

      - name: Verify protected runtime boundaries after materialization
        shell: bash
        run: |
          set -euxo pipefail
          git diff --exit-code refs/remotes/origin/golden/mcp-250-product-stable -- \
            Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/musicgeneration \
            Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/visualcreation \
            Android/src/app/src/main/jniLibs/arm64-v8a
          grep -F 'verified' Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/agentchat/AgentOfficeTruthGuard.kt
          grep -F 'rolled_back' Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/agentchat/AgentOfficeTruthGuard.kt
          grep -F 'model_tool_arguments' Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/agentchat/AgentTools.kt
          grep -F 'normalized_tool_arguments' Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/agentchat/AgentTools.kt
          grep -F 'resolved_operation' Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/agentchat/AgentTools.kt

      - name: Verify signed MCP252 APK identity and Office assets
        id: verify
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APK='Android/src/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep "name='com.localagent.plaza.mcp'"
          echo "$BADGING" | grep "versionCode='352'"
          echo "$BADGING" | grep "versionName='1.0.14-mcp.252'"
          for skill in word-document pdf-document excel-workbook powerpoint-presentation document-convert; do
            unzip -l "$APK" | grep "assets/skills/$skill/SKILL.md"
          done
          cp "$APK" "$RUNNER_TEMP/$APK_NAME"
          sha256sum "$RUNNER_TEMP/$APK_NAME" | tee "$RUNNER_TEMP/$APK_NAME.sha256"
          echo "apk_sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/$APK_NAME.sha256")" >> "$GITHUB_OUTPUT"

      - name: Upload MCP252 Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-agent-plaza-mcp-252
          path: |
            ${{ runner.temp }}/${{ env.APK_NAME }}
            ${{ runner.temp }}/${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish permanent MCP252 GitHub Release
        shell: bash
        run: |
          set -euxo pipefail
          gh release view "$APK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$APK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Local Agent Plaza MCP252 Office Truth Fix' \
              --notes 'MCP252 is an evidence-driven repair of MCP251 Office false-success behavior. It reproduces the uploaded failure logs before building, removes ambiguous default-to-create routing, adds common small-model argument aliases, safe workspace-aware operation inference, semantic read-back verification for all five Office skills, rollback on verification failure, and richer tool audit evidence while preserving MCP250 protected local music/image/native runtimes and the existing Agent protocol.'
          gh release upload "$APK_RELEASE_TAG" "$RUNNER_TEMP/$APK_NAME" "$RUNNER_TEMP/$APK_NAME.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$APK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets

      - name: Write MCP252 result marker
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' > /tmp/mcp252-result.json
          import json, os
          print(json.dumps({
              'schema': 'local-agent-plaza.mcp252-office-truth-result.v1',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_number': int(os.environ['GITHUB_RUN_NUMBER']),
              'commit_sha': os.environ['GITHUB_SHA'],
              'version_name': os.environ['LOCAL_VERSION_NAME'],
              'version_code': int(os.environ['LOCAL_VERSION_CODE']),
              'package': 'com.localagent.plaza.mcp',
              'release_tag': os.environ['APK_RELEASE_TAG'],
              'apk_name': os.environ['APK_NAME'],
              'apk_sha256': '${{ steps.verify.outputs.apk_sha256 }}',
              'evidence_zip': 'logs/mcp-251_测试日志与文档_20260903.zip',
              'release_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{os.environ['APK_RELEASE_TAG']}",
              'apk_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['APK_RELEASE_TAG']}/{os.environ['APK_NAME']}",
          }, ensure_ascii=False, indent=2))
          PY
          content="$(base64 -w0 /tmp/mcp252-result.json)"
          api="repos/${GITHUB_REPOSITORY}/contents/docs/mcp252_office_truth_result.json"
          old="$(gh api "$api?ref=experimental" 2>/dev/null || true)"
          sha="$(printf '%s' "$old" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("sha", ""))' 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method PUT "$api" -f message='Update MCP252 Office truth build result' -f branch=experimental -f sha="$sha" -f content="$content"
          else
            gh api --method PUT "$api" -f message='Create MCP252 Office truth build result' -f branch=experimental -f content="$content"
          fi
