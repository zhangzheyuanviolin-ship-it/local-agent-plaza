name: Apply MCP201 Z-Image integration

on:
  push:
    branches: [ "mcp201-zimage-work" ]
    paths:
      - '.github/workflows/apply-mcp201-zimage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp201-zimage-work
      - name: Apply Z-Image integration
        run: python3 Android/src/scripts/mcp201_integrate_zimage.py
      - name: Commit source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/visualcreation/ImageGenerationModelRegistry.kt
          git add -- Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/visualcreation/BonsaiImageModel.kt
          git add -- Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/visualcreation/VisualCreationTask.kt
          git add -- Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/visualcreation/VisualCreationViewModel.kt
          git add -- Android/src/app/src/main/java/com/google/ai/edge/gallery/ui/modelmanager/ModelManagerViewModel.kt
          git commit -m "MCP201: wire Z-Image Turbo task and runtime route"
          git push origin HEAD:mcp201-zimage-work
