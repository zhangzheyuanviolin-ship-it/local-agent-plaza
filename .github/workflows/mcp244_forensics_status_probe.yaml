name: MCP244 forensics status probe
on:
  push:
    branches: ["experimental"]
    paths: ['.github/workflows/mcp244_forensics_status_probe.yaml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental
      - shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mcp244_download_failure_forensics.yaml/runs?branch=experimental&per_page=5" > "$RUNNER_TEMP/runs.json"
          b64=$(base64 -w0 "$RUNNER_TEMP/runs.json")
          api="repos/$GITHUB_REPOSITORY/contents/docs/mcp244_forensics_runs.json"
          old=$(gh api "$api?ref=experimental" 2>/dev/null || true)
          sha=$(printf '%s' "$old" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("sha",""))' 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api --method PUT "$api" -f branch=experimental -f message='Update MCP244 forensics runs' -f sha="$sha" -f content="$b64"
          else
            gh api --method PUT "$api" -f branch=experimental -f message='Add MCP244 forensics runs' -f content="$b64"
          fi
