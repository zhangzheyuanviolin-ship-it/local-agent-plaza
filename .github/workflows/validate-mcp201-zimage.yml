name: Validate MCP201 Z-Image

on:
  push:
    branches: [ "mcp201-zimage-work" ]
    paths:
      - '.github/workflows/validate-mcp201-zimage.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Checkout stable-diffusion.cpp
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: 19bdfe22d255d5b4dff39d449318b9bc5ea2317f
          path: Android/src/app/src/main/cpp/third_party/stable-diffusion.cpp
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Z-Image assets and compile Android debug APK
        working-directory: Android/src
        run: |
          test "$(stat -c%s app/src/main/assets/zimage/zimage_cap_pad_token.bin)" = "15360"
          test "$(stat -c%s app/src/main/assets/zimage/zimage_temb_mlp.bin)" = "2102272"
          ./gradlew assembleDebug
