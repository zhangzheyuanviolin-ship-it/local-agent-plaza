name: Resolve APK Artifact URL

on:
  push:
    branches: [ "ci/actions-artifact-reporter" ]
    paths:
      - '.github/workflows/report_apk_artifact.yaml'

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target APK artifact and publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: bd2ab829b6a08d98df5ba2abc53056457a8f864a
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail

          python3 - > /tmp/pending.json <<'PY'
import json
print(json.dumps({
    "state": "pending",
    "target_url": "https://github.com/zhangzheyuanviolin-ship-it/local-agent-plaza/actions",
    "description": "Resolving MCP APK Actions artifact",
    "context": "mcp-apk-artifact",
}))
PY
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API/repos/$REPO/statuses/$TARGET_SHA" \
            --data-binary @/tmp/pending.json

          RUN_ID=""
          RUN_NUMBER=""
          ARTIFACT_ID=""
          ARTIFACT_NAME=""

          for attempt in $(seq 1 45); do
            RUNS_JSON="$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API/repos/$REPO/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=20")"

            read -r RUN_ID RUN_NUMBER < <(python3 -c '
import json, os, sys
j = json.load(sys.stdin)
target = os.environ["TARGET_SHA"]
for r in j.get("workflow_runs", []):
    if r.get("name") == "Build Android APK" and r.get("head_sha") == target:
        print(r.get("id", ""), r.get("run_number", ""))
        break
' <<< "$RUNS_JSON")

            if [ -n "$RUN_ID" ]; then
              ARTIFACTS_JSON="$(curl -fsSL \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "$API/repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100")"

              read -r ARTIFACT_ID ARTIFACT_NAME < <(python3 -c '
import json, sys
j = json.load(sys.stdin)
for a in j.get("artifacts", []):
    name = a.get("name", "")
    if name.startswith("local-agent-plaza-mcp-") and not a.get("expired", False):
        print(a.get("id", ""), name)
        break
' <<< "$ARTIFACTS_JSON")
            fi

            if [ -n "$RUN_ID" ] && [ -n "$ARTIFACT_ID" ]; then
              break
            fi
            echo "Artifact not ready yet (attempt $attempt)."
            sleep 20
          done

          test -n "$RUN_ID"
          test -n "$ARTIFACT_ID"
          TARGET_URL="$SERVER/$REPO/actions/runs/$RUN_ID/artifacts/$ARTIFACT_ID"
          DESCRIPTION="run=$RUN_NUMBER artifact=$ARTIFACT_ID name=$ARTIFACT_NAME"
          DESCRIPTION="${DESCRIPTION:0:140}"

          python3 - "$TARGET_URL" "$DESCRIPTION" > /tmp/status.json <<'PY'
import json, sys
print(json.dumps({
    "state": "success",
    "target_url": sys.argv[1],
    "description": sys.argv[2],
    "context": "mcp-apk-artifact",
}))
PY

          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API/repos/$REPO/statuses/$TARGET_SHA" \
            --data-binary @/tmp/status.json

          echo "Resolved $TARGET_URL"
