name: Resolve APK Artifact URL

on:
  push:
    branches: [ "ci/actions-artifact-reporter" ]
    paths:
      - '.github/workflows/report_apk_artifact.yaml'

permissions:
  contents: write
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve MCP209 APK artifact and write CI metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: bd2ab829b6a08d98df5ba2abc53056457a8f864a
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
          SERVER: ${{ github.server_url }}
          REPORT_BRANCH: ci/actions-artifact-reporter
        run: |
          set -euo pipefail
          RUN_ID=""
          RUN_NUMBER=""
          ARTIFACT_ID=""
          ARTIFACT_NAME=""

          for attempt in $(seq 1 45); do
            RUNS_JSON="$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API/repos/$REPO/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=20")"

            read -r RUN_ID RUN_NUMBER < <(python3 -c '
import json, os, sys
j = json.load(sys.stdin)
target = os.environ["TARGET_SHA"]
for r in j.get("workflow_runs", []):
    if r.get("name") == "Build Android APK" and r.get("head_sha") == target:
        print(r.get("id", ""), r.get("run_number", ""))
        break
' <<< "$RUNS_JSON")

            if [ -n "$RUN_ID" ]; then
              ARTIFACTS_JSON="$(curl -fsSL \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "$API/repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100")"

              read -r ARTIFACT_ID ARTIFACT_NAME < <(python3 -c '
import json, sys
j = json.load(sys.stdin)
for a in j.get("artifacts", []):
    name = a.get("name", "")
    if name.startswith("local-agent-plaza-mcp-") and not a.get("expired", False):
        print(a.get("id", ""), name)
        break
' <<< "$ARTIFACTS_JSON")
            fi

            if [ -n "$RUN_ID" ] && [ -n "$ARTIFACT_ID" ]; then
              break
            fi
            echo "Artifact not ready yet (attempt $attempt)."
            sleep 20
          done

          test -n "$RUN_ID"
          test -n "$ARTIFACT_ID"
          ARTIFACT_URL="$SERVER/$REPO/actions/runs/$RUN_ID/artifacts/$ARTIFACT_ID"
          RUN_URL="$SERVER/$REPO/actions/runs/$RUN_ID"

          cat > /tmp/mcp209-artifact.txt <<EOF
          target_sha=$TARGET_SHA
          run_number=$RUN_NUMBER
          run_id=$RUN_ID
          artifact_name=$ARTIFACT_NAME
          artifact_id=$ARTIFACT_ID
          artifact_url=$ARTIFACT_URL
          run_url=$RUN_URL
          EOF

          python3 - <<'PY' > /tmp/content.json
import base64, json, os
content = open('/tmp/mcp209-artifact.txt', 'rb').read()
print(json.dumps({
    'message': 'CI: record MCP209 artifact metadata',
    'content': base64.b64encode(content).decode(),
    'branch': os.environ['REPORT_BRANCH'],
}))
PY

          curl -fsSL -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API/repos/$REPO/contents/.github/mcp209-artifact.txt" \
            --data-binary @/tmp/content.json

          echo "Resolved $ARTIFACT_URL"
