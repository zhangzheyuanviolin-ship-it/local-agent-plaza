name: Qwen3.5 2B conversion silent probe

on:
  push:
    branches: ["experimental"]
    paths:
      - '.github/workflows/qwen35_2b_probe.yaml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental
          fetch-depth: 0
      - name: Capture conversion workflow run state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/qwen35_2b_q8_32k_convert.yaml/runs?branch=experimental&per_page=10" \
            --jq '{captured_at: now | todate, workflow_runs: [.workflow_runs[] | {id, run_number, event, status, conclusion, head_sha, created_at, updated_at, html_url}]}' \
            > docs/qwen35_2b_q8_32768_probe.json
          cat docs/qwen35_2b_q8_32768_probe.json
      - name: Commit probe state without retriggering conversion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/qwen35_2b_q8_32768_probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Qwen3.5 2B conversion run state [skip ci]'
          for n in 1 2 3 4 5; do
            git pull --rebase origin experimental && git push origin HEAD:experimental && exit 0
            sleep $((n*3))
          done
          exit 1
