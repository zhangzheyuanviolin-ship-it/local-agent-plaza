name: Qwen3.5 Q8 Conversion Bridge

on:
  push:
    branches: ["experimental"]
    paths:
      - '.github/workflows/build_android.yaml'
      - 'model-conversion/qwen35/**'
  pull_request:
    branches: ["main"]
    paths:
      - '.github/workflows/build_android.yaml'
      - 'model-conversion/qwen35/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: qwen35-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert_qwen35_q8:
    name: Convert Qwen3.5-2B Q8 4096
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CONFIG_PATH: model-conversion/qwen35/configs/2b-q8-4096.json
      OUTPUT_DIR: ${{ github.workspace }}/qwen35-output
      HF_HOME: ${{ runner.temp }}/hf-home
      TRANSFORMERS_CACHE: ${{ runner.temp }}/hf-home
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
      MALLOC_ARENA_MAX: '2'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Publish pending conversion status
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "qwen35-litert-conversion",
              "description": "Qwen3.5-2B Q8 conversion and validation running",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary "@$RUNNER_TEMP/status.json"

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          docker system prune -af || true
          df -h

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LiteRT conversion and 0.15 runtime packages
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --pre --upgrade litert-torch-nightly
          python -m pip install --pre --upgrade 'litert-lm-api-nightly==0.15.0.dev20260727'
          python -m pip install --upgrade psutil
          python - <<'PY'
          import importlib.metadata
          for name in ('litert-torch-nightly','litert-lm-api-nightly','litert-lm-builder','litert-lm-builder-nightly','transformers','torch'):
              try:
                  print(name, importlib.metadata.version(name))
              except importlib.metadata.PackageNotFoundError:
                  print(name, 'not-installed')
          PY
          df -h

      - name: Ensure current Google Qwen3.5 reauthoring is present
        shell: bash
        run: |
          set -euo pipefail
          check_support() {
            python - <<'PY'
          import inspect
          from transformers import Qwen3_5Config
          from litert_torch.generative.export_hf.model_ext.qwen3_5 import exportable_module
          from litert_torch.generative.export_hf.model_ext.qwen3_5 import modeling_qwen3_5_static
          from litert_torch.generative.export_hf.model_ext import metadata_builder
          assert hasattr(exportable_module, 'LiteRTExportableModuleForQwen3_5Prefill')
          assert hasattr(exportable_module, 'LiteRTExportableModuleForQwen3_5Generate')
          assert hasattr(modeling_qwen3_5_static, 'Qwen3_5StaticGatedDeltaNet')
          assert metadata_builder.build_executor_metadata is not None
          src = inspect.getsource(metadata_builder.build_executor_metadata)
          assert 'TYPE_LINEAR_ATTENTION' in src
          assert 'kv_cache_c_' in src and 'kv_cache_r_' in src
          print('Qwen3.5 export support is present.')
          PY
          }

          if check_support; then
            exit 0
          fi

          echo 'Overlaying current Google Qwen3.5 export implementation.'
          python - <<'PY' || python -m pip install --upgrade 'git+https://github.com/huggingface/transformers.git'
          from transformers import Qwen3_5Config
          print(Qwen3_5Config)
          PY
          rm -rf "$RUNNER_TEMP/litert-torch-main"
          git clone --depth 1 https://github.com/google-ai-edge/litert-torch.git "$RUNNER_TEMP/litert-torch-main"
          PKG_DIR="$(python - <<'PY'
          import pathlib, litert_torch
          print(pathlib.Path(litert_torch.__file__).resolve().parent)
          PY
          )"
          rsync -a "$RUNNER_TEMP/litert-torch-main/litert_torch/generative/export_hf/model_ext/qwen3_5/" "$PKG_DIR/generative/export_hf/model_ext/qwen3_5/"
          cp "$RUNNER_TEMP/litert-torch-main/litert_torch/generative/export_hf/model_ext/exportables.py" "$PKG_DIR/generative/export_hf/model_ext/exportables.py"
          cp "$RUNNER_TEMP/litert-torch-main/litert_torch/generative/export_hf/model_ext/metadata_builder.py" "$PKG_DIR/generative/export_hf/model_ext/metadata_builder.py"
          cp "$RUNNER_TEMP/litert-torch-main/litert_torch/generative/export_hf/core/litert_lm_builder.py" "$PKG_DIR/generative/export_hf/core/litert_lm_builder.py"
          check_support

      - name: Verify builder exposes executor metadata
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import litert_lm_builder
          from litert_lm_builder.runtime.proto import executor_metadata_pb2
          assert hasattr(litert_lm_builder.LitertLmFileBuilder, 'add_executor_metadata')
          assert hasattr(executor_metadata_pb2, 'ExecutorMetadata')
          assert hasattr(executor_metadata_pb2, 'StateBuffer')
          print('builder:', litert_lm_builder.__file__)
          PY

      - name: Convert with lightweight path
        id: lightweight
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          /usr/bin/time -v python model-conversion/qwen35/convert_qwen35.py \
            --config "$CONFIG_PATH" \
            --output-dir "$OUTPUT_DIR" \
            --lightweight true 2>&1 | tee "$RUNNER_TEMP/qwen35-lightweight.log"

      - name: Retry with standard conversion path
        if: steps.lightweight.outcome != 'success'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          /usr/bin/time -v python model-conversion/qwen35/convert_qwen35.py \
            --config "$CONFIG_PATH" \
            --output-dir "$OUTPUT_DIR" \
            --lightweight false 2>&1 | tee "$RUNNER_TEMP/qwen35-standard.log"

      - name: Resolve bundle
        id: bundle
        shell: bash
        run: |
          set -euxo pipefail
          BUNDLE="$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.litertlm' -print -quit)"
          test -n "$BUNDLE"
          test -f "$BUNDLE"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          ls -lh "$OUTPUT_DIR"
          df -h

      - name: Validate container hybrid state and runtime
        shell: bash
        run: |
          set -euxo pipefail
          /usr/bin/time -v python model-conversion/qwen35/verify_qwen35.py \
            --config "$CONFIG_PATH" \
            --bundle "${{ steps.bundle.outputs.bundle }}" \
            --manifest "$OUTPUT_DIR/conversion_manifest.json" 2>&1 | tee "$OUTPUT_DIR/verification.log"

      - name: Upload verified Qwen3.5 model
        id: upload_model
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-2b-q8-4096-litertlm
          path: |
            qwen35-output/*.litertlm
            qwen35-output/*.sha256
            qwen35-output/conversion_manifest.json
            qwen35-output/runtime_smoke_output.txt
            qwen35-output/verification.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish successful conversion status
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_URL: ${{ steps.upload_model.outputs.artifact-url }}
        run: |
          set -euxo pipefail
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
              "state": "success",
              "context": "qwen35-litert-conversion",
              "description": "Verified Qwen3.5-2B Q8 / 4096 artifact published",
              "target_url": os.environ.get('ARTIFACT_URL') or f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary "@$RUNNER_TEMP/status.json"
