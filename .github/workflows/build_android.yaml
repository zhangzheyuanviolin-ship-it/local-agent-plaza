name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "experimental", "feature/**" ]
    paths:
      - 'Android/**'
      - '.github/workflows/build_android.yaml'
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Android/**'
      - '.github/workflows/build_android.yaml'

permissions:
  contents: read
  actions: read

jobs:
  split_qwen35_model:
    name: Split verified Qwen3.5 model artifact
    if: >-
      (github.event_name == 'push' && github.ref_name == 'feature/qwen35-artifact-split') ||
      (github.event_name == 'pull_request' && github.head_ref == 'feature/qwen35-artifact-split')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT_ID: '9367298862'
      SOURCE_RUN_ID: '32255079022'
      MODEL_NAME: 'Qwen3.5-2B-LiteRT-LM-Q8-4096.litertlm'
    steps:
      - name: Download verified source artifact and split model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source parts manifest
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip"
          echo "Downloading verified source artifact ${SOURCE_ARTIFACT_ID} from run ${SOURCE_RUN_ID}"
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" -o source/source.zip
          unzip -q source/source.zip -d source/extracted
          mapfile -t candidates < <(find source/extracted -type f -name 'local-agent-plaza-*.apk' -print)
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "Expected exactly one bridged model file, found ${#candidates[@]}" >&2
            printf '%s\n' "${candidates[@]:-}" >&2
            exit 1
          fi
          src="${candidates[0]}"
          magic="$(head -c 8 "$src")"
          test "$magic" = 'LITERTLM'
          cp "$src" "manifest/${MODEL_NAME}"
          bytes="$(stat -c '%s' "manifest/${MODEL_NAME}")"
          sha="$(sha256sum "manifest/${MODEL_NAME}" | awk '{print $1}')"
          printf '%s  %s\n' "$sha" "$MODEL_NAME" > manifest/model.sha256
          printf 'filename=%s\nbytes=%s\nsha256=%s\nmagic=LITERTLM\nsource_run_id=%s\nsource_artifact_id=%s\n' \
            "$MODEL_NAME" "$bytes" "$sha" "$SOURCE_RUN_ID" "$SOURCE_ARTIFACT_ID" > manifest/model-info.txt
          split -b 480000000 -d -a 2 "manifest/${MODEL_NAME}" parts/qwen35.part.
          count="$(find parts -maxdepth 1 -type f -name 'qwen35.part.*' | wc -l)"
          echo "parts=$count bytes=$bytes sha256=$sha"
          test "$count" -eq 10
          rm "manifest/${MODEL_NAME}"
          ls -lh parts manifest

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-q8-4096-manifest
          path: manifest/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-q8-4096-part-00
          path: parts/qwen35.part.00
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-q8-4096-part-01
          path: parts/qwen35.part.01
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-q8-4096-part-02
          path: parts/qwen35.part.02
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-q8-4096-part-03
          path: parts/qwen35.part.03
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-q8-4096-part-04
          path: parts/qwen35.part.04
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-q8-4096-part-05
          path: parts/qwen35.part.05
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-q8-4096-part-06
          path: parts/qwen35.part.06
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Upload part 07
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-q8-4096-part-07
          path: parts/qwen35.part.07
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Upload part 08
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-q8-4096-part-08
          path: parts/qwen35.part.08
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Upload part 09
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-q8-4096-part-09
          path: parts/qwen35.part.09
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
