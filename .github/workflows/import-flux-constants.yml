name: Import FLUX host constants

on:
  push:
    branches: [mcp197-work]
    paths:
      - '.github/workflows/import-flux-constants.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp197-work
          fetch-depth: 0
      - name: Extract validated FLUX host constants
        run: |
          curl -L --fail --retry 3 -o box.apk \
            https://github.com/jegly/Box/releases/download/v3.3.3/Box_v3.3.3_Main_Signed_Release.apk
          mkdir -p Android/src/app/src/main/assets/fluxklein
          unzip -p box.apk assets/fluxklein/enc_cos.bin > Android/src/app/src/main/assets/fluxklein/enc_cos.bin
          unzip -p box.apk assets/fluxklein/enc_sin.bin > Android/src/app/src/main/assets/fluxklein/enc_sin.bin
          unzip -p box.apk assets/fluxklein/dit_cos.bin > Android/src/app/src/main/assets/fluxklein/dit_cos.bin
          unzip -p box.apk assets/fluxklein/dit_sin.bin > Android/src/app/src/main/assets/fluxklein/dit_sin.bin
          unzip -p box.apk assets/fluxklein/sigmas.bin > Android/src/app/src/main/assets/fluxklein/sigmas.bin
          unzip -p box.apk assets/fluxklein/temb.bin > Android/src/app/src/main/assets/fluxklein/temb.bin
          unzip -p box.apk assets/fluxklein/bn_mean.bin > Android/src/app/src/main/assets/fluxklein/bn_mean.bin
          unzip -p box.apk assets/fluxklein/bn_std.bin > Android/src/app/src/main/assets/fluxklein/bn_std.bin
          test $(stat -c%s Android/src/app/src/main/assets/fluxklein/sigmas.bin) -eq 20
      - name: Commit constants
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android/src/app/src/main/assets/fluxklein
          git commit -m 'MCP197: add validated FLUX host constants'
          git push origin HEAD:mcp197-work
