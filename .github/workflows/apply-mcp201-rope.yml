name: Apply MCP201 Z-Image RoPE fix

on:
  push:
    branches: [ "mcp201-zimage-work" ]
    paths:
      - '.github/workflows/apply-mcp201-rope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp201-zimage-work
      - name: Apply exact Box RoPE dimensions
        run: python3 Android/src/scripts/mcp201_fix_zimage_rope.py
      - name: Commit runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/visualcreation/ZImageTurboRuntime.kt
          git commit -m "MCP201: match Box Z-Image RoPE axes exactly"
          git push origin HEAD:mcp201-zimage-work
