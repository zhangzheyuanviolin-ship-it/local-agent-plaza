name: Apply MCP197 core repairs v2

on:
  push:
    branches: [mcp197-work]
    paths:
      - '.github/workflows/apply-mcp197-core-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcp197-work
          fetch-depth: 0
      - name: Patch persistent resume and Bonsai backend display
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p=Path(path); s=p.read_text()
              n=s.count(old)
              if n != 1: raise SystemExit(f'{path}: expected 1 match, got {n}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))

          vm='Android/src/app/src/main/java/com/google/ai/edge/gallery/ui/modelmanager/ModelManagerViewModel.kt'
          one(vm,
              '    // Delete the model files first.\n    deleteModel(model = model)\n\n    // Start to send download request.\n',
              '    // Keep completed files and .tmp ranges. The worker resumes from persisted bytes.\n    // Only the explicit delete action clears model data.\n')
          one(vm,
              '    downloadRepository.cancelDownloadModel(model)\n    deleteModel(model = model)\n  }',
              '    // Treat cancellation as pause. Preserve final component files and .tmp ranges.\n    downloadRepository.cancelDownloadModel(model)\n  }')
          one(vm,
'''  private fun isModelPartiallyDownloaded(model: Model): Boolean {
    if (model.localModelFilePathOverride.isNotEmpty()) {
      return false
    }

    // A model is partially downloaded when the tmp file exists.
    return getModelDownloadTempFile(model).exists()
  }

  private fun getModelDownloadTempFile(model: Model): File {
    return File(
      externalFilesDir,
      listOf(model.normalizedName, model.version, "${model.downloadFileName}.$TMP_FILE_EXT")
        .joinToString(File.separator),
    )
  }
''',
'''  private fun modelDownloadFileNames(model: Model): List<String> =
    listOf(model.downloadFileName) + model.extraDataFiles.map { it.downloadFileName }

  private fun modelDownloadDirectory(model: Model): File =
    File(
      externalFilesDir,
      listOf(model.normalizedName, model.version).joinToString(File.separator),
    )

  private fun isModelPartiallyDownloaded(model: Model): Boolean {
    if (model.localModelFilePathOverride.isNotEmpty()) return false
    val dir = modelDownloadDirectory(model)
    val names = modelDownloadFileNames(model)
    val hasAnyBytes = names.any { name ->
      File(dir, name).length() > 0L || File(dir, "$name.$TMP_FILE_EXT").length() > 0L
    }
    val allCompleted = names.all { name -> File(dir, name).length() > 0L }
    return hasAnyBytes && !allCompleted
  }

  private fun getModelDownloadedBytes(model: Model): Long {
    val dir = modelDownloadDirectory(model)
    return modelDownloadFileNames(model).sumOf { name ->
      val partial = File(dir, "$name.$TMP_FILE_EXT")
      val completed = File(dir, name)
      when {
        partial.length() > 0L -> partial.length()
        completed.length() > 0L -> completed.length()
        else -> 0L
      }
    }
  }
''')
          one(vm,
              '      val tmpFile = getModelDownloadTempFile(model)\n      receivedBytes = tmpFile.length()\n',
              '      receivedBytes = getModelDownloadedBytes(model)\n')

          worker='Android/src/app/src/main/java/com/google/ai/edge/gallery/worker/DownloadWorker.kt'
          one(worker,
'''          for (file in allFiles) {
            val candidateUrls =
              file.url.split("\\n").map { it.trim() }.filter { it.isNotEmpty() }.distinct()
''',
'''          for (file in allFiles) {
            val persistedDir =
              File(
                applicationContext.getExternalFilesDir(null),
                listOf(modelDir, version).joinToString(separator = File.separator),
              )
            if (!persistedDir.exists()) persistedDir.mkdirs()
            val completedFile = File(persistedDir, file.fileName)
            val partialFile = File(persistedDir, "${file.fileName}.$TMP_FILE_EXT")
            if (completedFile.length() > 0L && !partialFile.exists()) {
              downloadedBytes += completedFile.length()
              setProgress(
                Data.Builder().putLong(KEY_MODEL_DOWNLOAD_RECEIVED_BYTES, downloadedBytes).build()
              )
              setForeground(
                createForegroundInfo(
                  progress = if (totalBytes > 0L) (downloadedBytes * 100 / totalBytes).toInt() else 0,
                  modelName = modelName,
                )
              )
              Log.d(TAG, "Resume: keeping completed component ${completedFile.name}")
              continue
            }
            val candidateUrls =
              file.url.split("\\n").map { it.trim() }.filter { it.isNotEmpty() }.distinct()
''')

          repo='Android/src/app/src/main/java/com/google/ai/edge/gallery/data/DownloadRepository.kt'
          one(repo,
'''            val partialFile = getPartialDownloadFile(model)
            val partialBytes = partialFile.length()
            if (partialBytes > 0L) {
              status = ModelDownloadStatusType.PARTIALLY_DOWNLOADED
            }
''',
'''            val partialBytes = getDownloadedBytes(model)
            if (hasPersistentPartialDownload(model)) {
              status = ModelDownloadStatusType.PARTIALLY_DOWNLOADED
            }
''')
          one(repo,
'''  private fun getPartialDownloadFile(model: Model): File {
    return File(
      context.getExternalFilesDir(null),
      listOf(model.normalizedName, model.version, "${model.downloadFileName}.$TMP_FILE_EXT")
        .joinToString(File.separator),
    )
  }
''',
'''  private fun modelDownloadDirectory(model: Model): File =
    File(
      context.getExternalFilesDir(null),
      listOf(model.normalizedName, model.version).joinToString(File.separator),
    )

  private fun modelDownloadFileNames(model: Model): List<String> =
    listOf(model.downloadFileName) + model.extraDataFiles.map { it.downloadFileName }

  private fun getDownloadedBytes(model: Model): Long {
    val dir = modelDownloadDirectory(model)
    return modelDownloadFileNames(model).sumOf { name ->
      val partial = File(dir, "$name.$TMP_FILE_EXT")
      val completed = File(dir, name)
      when {
        partial.length() > 0L -> partial.length()
        completed.length() > 0L -> completed.length()
        else -> 0L
      }
    }
  }

  private fun hasPersistentPartialDownload(model: Model): Boolean {
    val dir = modelDownloadDirectory(model)
    val names = modelDownloadFileNames(model)
    val hasAnyBytes = names.any { name ->
      File(dir, name).length() > 0L || File(dir, "$name.$TMP_FILE_EXT").length() > 0L
    }
    val allCompleted = names.all { name -> File(dir, name).length() > 0L }
    return hasAnyBytes && !allCompleted
  }
''')

          screen='Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/visualcreation/VisualCreationScreen.kt'
          one(screen,
              '  val selectedModelInfo = ImageGenerationModelRegistry.findModel(selectedAppModel.name)\n',
              '  val selectedModelInfo = findVisualCreationImageModelInfo(selectedAppModel.name)\n')
          one(screen,
              '          text = "推理后端：${selectedModelInfo?.backend ?: ImageGenerationBackend.STABLE_DIFFUSION_CPP}",\n',
              '          text = "推理后端：${imageGenerationBackendDisplayName(selectedAppModel.name, selectedModelInfo)}",\n')

          bmodel='Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/visualcreation/BonsaiImageModel.kt'
          p=Path(bmodel); s=p.read_text()
          marker='fun isBonsaiImageModel(modelId: String): Boolean = modelId == BONSAI_IMAGE_MODEL_ID\n'
          if marker not in s: raise SystemExit('Bonsai marker missing')
          helper='''\nfun imageGenerationBackendDisplayName(\n  modelName: String,\n  modelInfo: ImageGenerationModelInfo?,\n): String =\n  when {\n    isBonsaiImageModel(modelName) -> "LiteRT CPU / XNNPACK"\n    modelInfo?.backend == ImageGenerationBackend.LOCAL_DREAM_QNN_MNN -> "Local Dream QNN / MNN"\n    modelInfo?.backend == ImageGenerationBackend.STABLE_DIFFUSION_CPP -> "stable-diffusion.cpp"\n    else -> "未知"\n  }\n'''
          if 'fun imageGenerationBackendDisplayName(' not in s:
              s=s.replace(marker, marker+helper,1)
          p.write_text(s)
          PY
      - name: Verify patches
        run: |
          grep -q 'Treat cancellation as pause' Android/src/app/src/main/java/com/google/ai/edge/gallery/ui/modelmanager/ModelManagerViewModel.kt
          grep -q 'Resume: keeping completed component' Android/src/app/src/main/java/com/google/ai/edge/gallery/worker/DownloadWorker.kt
          grep -q 'LiteRT CPU / XNNPACK' Android/src/app/src/main/java/com/google/ai/edge/gallery/customtasks/visualcreation/BonsaiImageModel.kt
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android/src/app/src/main/java/com/google/ai/edge/gallery
          git commit -m 'MCP197: preserve resumable downloads and fix Bonsai backend label'
          git push origin HEAD:mcp197-work
